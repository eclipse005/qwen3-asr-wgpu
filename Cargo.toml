[workspace]

[package]
name = "qwen3-asr-wgpu"
version = "0.1.0"
edition = "2021"
description = "Qwen3-ASR speech recognition on wgpu — cross-vendor GPU inference in Rust"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/eclipse005/qwen3-asr-wgpu"

[lib]
name = "qwen3_asr_wgpu"
path = "src/lib.rs"

[[bin]]
name = "spike"
path = "src/main.rs"

[[bin]]
name = "transcribe"
path = "src/bin/transcribe.rs"

[dependencies]
wgpu = "30.0.1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
anyhow = "1"
memmap2 = "0.9"
bytes = "1.11"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", features = ["onig"] }
hound = "3"
rustfft = "6"
gemm = "0.18"
rayon = "1.10"
libm = "0.2"
thiserror = "2"
# `hub` feature only: download a model from HuggingFace (src/hub.rs).
reqwest = { version = "0.12", features = ["blocking"], optional = true }

[features]
# Off by default: it pulls in reqwest and TLS, and a local checkpoint needs
# neither.
hub = ["dep:reqwest"]

[build-dependencies]
cmake = "0.1"

[profile.release]
debug = false
