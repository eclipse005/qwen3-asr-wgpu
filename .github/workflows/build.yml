name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # reqwest (the `hub` feature) uses native-tls, which needs OpenSSL
      # headers on Linux only.
      - name: Install build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Test
        run: cargo test --release

      - name: Check the hub feature
        run: cargo check --release --features hub

  package:
    name: package / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            exe: ""
            archive: tar.gz
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            exe: .exe
            archive: zip
            # Static CRT: no VC++ Redistributable needed on the target machine.
            rustflags: -C target-feature=+crt-static
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            exe: ""
            archive: tar.gz
            rustflags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin transcribe
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # Runs the real binary on a machine with no GPU and no model: proves it
      # starts and its data tables are intact.
      - name: Smoke test
        shell: bash
        run: ./target/${{ matrix.target }}/release/transcribe${{ matrix.exe }} --languages

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dir="qwen3-asr-wgpu-${{ matrix.name }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/transcribe${{ matrix.exe }}" "$dir/"
          cp README.md LICENSE "$dir/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: qwen3-asr-wgpu-${{ matrix.name }}.${{ matrix.archive }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: qwen3-asr-wgpu-${{ matrix.name }}.${{ matrix.archive }}
          generate_release_notes: true
